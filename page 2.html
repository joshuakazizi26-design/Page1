
<!DOCTYPE html>
<html>
<head>
    <title>Fresh Fruits Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f8e9;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: green;
            color: white;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .fruit {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
        }

        .fruit img {
            width: 130px;
            height: 120px;
            object-fit: cover;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }

        #cart {
            background: white;
            margin: 20px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍎 FRESH FRUITS SHOP 🍌</h1>
    <p>Welcome! Buy fresh fruits online.</p>
</header>

<h2>Available Fruits</h2>

<div class="container">

    <div class="fruit">
        <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300">
        <h3>Apples</h3>
        <p>Price: 1000 RWF</p>
        <button onclick="addToCart('Apples', 1000)">
            Buy Now
        </button>
    </div>

    <div class="fruit">
        <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300">
        <h3>Bananas</h3>
        <p>Price: 500 RWF</p>
        <button onclick="addToCart('Bananas', 500)">
            Buy Now
        </button>
    </div>

    <div class="fruit">
        <img src="https://images.unsplash.com/photo-1611080626919-7cf5a9dbab12?w=300">
        <h3>Oranges</h3>
        <p>Price: 800 RWF</p>
        <button onclick="addToCart('Oranges', 800)">
            Buy Now
        </button>
    </div>

    <div class="fruit">
        <img src="https://images.unsplash.com/photo-1518843875459-f738682238a6?w=300">
        <h3>Mangoes</h3>
        <p>Price: 700 RWF</p>
        <button onclick="addToCart('Mangoes', 700)">
            Buy Now
        </button>
    </div>

</div>

<div id="cart">
    <h2>🛒 My Shopping Cart</h2>

    <ul id="cartItems"></ul>

    <h3>Total: <span id="total">0</span> RWF</h3>

    <button onclick="checkout()">Checkout</button>
</div>

<script>

    let total = 0;

    function addToCart(name, price) {

        let cart = document.getElementById("cartItems");

        let item = document.createElement("li");

        item.textContent = name + " - " + price + " RWF";

        cart.appendChild(item);

        total = total + price;

        document.getElementById("total").textContent = total;
        
        alert(name + " added to your cart!");
    }

    function checkout() {

        if (total === 0) {
            alert("Your cart is empty!");
        } else {
            alert("Thank you for shopping! Your total is " 
            + total + " RWF");
        }

    }

</script>

</body>
</html>
