
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: rgba(0, 0, 0, 0.3);
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .content {
            padding: 100px 20px;
        }

        .content h2 {
            font-size: 40px;
        }

        .content p {
            font-size: 18px;
            color: #ddd;
        }

        .next-button {
            display: inline-block;
            margin-top: 50px;
            padding: 15px 40px;
            background: #00c6ff;
            color: #111;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .next-button:hover {
            background: white;
            transform: scale(1.1);
        }

        footer {
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>MY WEBSITE</h1>
    </header>

    <div class="content">
        <h2>Welcome!</h2>

        <p>
            Welcome to my keyness website.
            There is much more to get from it.
        </p>

        <p>Click to next page to go to kenzy website.</p>

        <a href="page2.html" class="next-button">
            CLICK TO CONTINUE →
        </a>
    </div>

    <footer>
        © 2026 My Website. All Rights Reserved.
    </footer>

</body>
</html>
